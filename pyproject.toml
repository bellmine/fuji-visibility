[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fuji-visibility"
version = "0.1.0"
description = "CLI tools for inspecting Open-Meteo forecasts behind Mt. Fuji visibility decisions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-httpx>=0.30,<1",
]

[project.scripts]
fuji = "fuji_visibility.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fuji_visibility"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that call a live Open-Meteo endpoint",
]

[tool.ruff]
line-length = 100
target-version = "py312"
