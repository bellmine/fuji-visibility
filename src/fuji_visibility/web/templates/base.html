<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Mt. Fuji Visibility{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">△</span>
        <span>Mt. Fuji Visibility</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/">Dashboard</a>
        <a href="/diagnostics">Diagnostics</a>
      </nav>
    </div>
  </header>

  <main class="shell page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="shell site-footer">
    <span>Fuji Visibility · stored forecast evidence</span>
    <span class="footer-links"><a href="/health">health</a> · <a href="/diagnostics">diagnostics</a></span>
  </footer>

  <script src="{{ url_for('static', path='app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
