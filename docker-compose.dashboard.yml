services:
  fuji-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuji-dashboard
    restart: unless-stopped
    command: ["uvicorn", "fuji_visibility.web.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    env_file:
      - .env
    environment:
      FUJI_DB_PATH: /app/data/fuji_forecasts.sqlite
      FUJI_RAW_DATA_DIR: /app/data/raw
      FUJI_REFRESH_LOCK_PATH: /app/data/refresh.lock
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    networks:
      - npm_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  fuji-snapshot-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuji-snapshot-worker
    restart: unless-stopped
    command: ["python", "-m", "fuji_visibility.snapshot_worker"]
    env_file:
      - .env
    environment:
      FUJI_DB_PATH: /app/data/fuji_forecasts.sqlite
      FUJI_RAW_DATA_DIR: /app/data/raw
      FUJI_REFRESH_LOCK_PATH: /app/data/refresh.lock
    volumes:
      - ./data:/app/data
    networks:
      - npm_default

networks:
  npm_default:
    external: true
